# BQEMU runtime configuration. Docker copies the selected BQEMU_CONFIG_SOURCE
# into /etc/bqemu/bqemu.yaml at build time by default. A read-only runtime mount
# may replace it. Select either path with --config or BQEMU_CONFIG.
apiVersion: config.bqemu.dev/v1alpha1
kind: BQEMUConfig

defaults:
  projectId: local-project
  location: US

server:
  http:
    address: ":9050"
    publicUrl: http://localhost:9050
    readHeaderTimeout: "5s"
    readTimeout: "30s"
    writeTimeout: "30s"
    idleTimeout: "2m"
    # Applied while reading the wire body, including chunked requests.
    maxCompressedRequestBytes: 2097152
    # Applied after gzip decoding to prevent compression amplification.
    maxUncompressedRequestBytes: 2097152
  grpc:
    address: ":9060"
    maxReceiveMessageBytes: 33554432
    maxSendMessageBytes: 33554432
  tls:
    certFile: ""
    keyFile: ""

database:
  adapter: duckdb
  dsn: /data/bqemu.duckdb
  tempDirectory: /tmp/bqemu

runtime:
  shutdownTimeout: "10s"
  serverDrainTimeout: "5s"
  storageCloseTimeout: "4s"
  jobPollInterval: "100ms"
  readSessionTtl: "6h"
  cleanupInterval: "1m"

query:
  # Server-side hard ceiling. REST timeoutMs/jobTimeoutMs compatibility is a
  # separate, narrower request contract.
  operationTimeout: "2m"
  # Bounds physical cleanup after metadata publication failures, even when the
  # originating request has already been cancelled.
  compensationTimeout: "30s"
  # BigQuery documents anonymous cached result tables as approximately 24h.
  anonymousResultTtl: "24h"

tableData:
  # Bounds catalog admission, TTL resolution, and one count-and-page transaction.
  operationTimeout: "30s"
  # The server may return fewer rows than maxResults and never exceeds this cap.
  maxPageRows: 10000
  # Exact JSON page cap; BigQuery normally paginates at approximately 10 MB.
  maxResponseBytes: 10000000
  # Exact one-row exception cap; BigQuery documents up to approximately 100 MB.
  maxRowBytes: 100000000

storage:
  read:
    enabled: true
    maxStreams: 64
    defaultStreamCount: 4
    rowsPerResponse: 10000
    maxResponseBytes: 16777216
    maxSchemaBytes: 1048576
    maxSessions: 128
    spillThresholdBytes: 67108864
    maxRowBytes: 8388608
    maxSnapshotBytes: 536870912
    maxTotalSnapshotBytes: 4294967296
    maxSnapshotRows: 10000000
    tempFilePattern: bqemu-storage-read-*
    protocolModelVersion: google.cloud.bigquery.storage.v1+spark-bigquery-connector-0.44.2
  write:
    enabled: true
    maxStreams: 1024
    maxAppendRequestBytes: 20971520
    maxAppendEnvelopeBytes: 65536
    maxConcurrentAppendRequests: 16
    queueCapacity: 256
    queueWaitTimeout: "5s"
    operationTimeout: "30s"
    maxInFlightBytes: 268435456
    maxInFlightBytesPerStream: 33554432
    maxStagedBytes: 4294967296
    maxStagedBytesPerStream: 536870912
    orphanTtl: "6h"
    cleanupInterval: "1m"
    protocolModelVersion: google.cloud.bigquery.storage.v1+spark-bigquery-connector-0.44.2

# Enable only with an explicit fake-GCS or GCS-compatible JSON endpoint.
# file:// sources remain disabled unless allowFileSources is deliberately set.
load:
  enabled: false
  gcsEndpoint: ""
  allowFileSources: false
  operationTimeout: "2m"
  maxObjects: 1000
  maxObjectBytes: 1073741824
  maxTotalBytes: 4294967296
  maxMetadataBytes: 8388608
  maxListedObjects: 10000

auth:
  mode: disabled
  # RFC 6750 bearer parsing is shared by the REST and gRPC public edges.
  # https://www.rfc-editor.org/rfc/rfc6750#section-2.1
  minTokenBytes: 1
  maxTokenBytes: 16384
  maxAuthorizationBytes: 32768
  # StaticTokenSet is a local credential adapter, not IAM emulation. Mount this
  # file read-only in containers; invalid startup content is fatal and an
  # invalid reload atomically changes the verifier to deny-all until recovery.
  staticTokensFile: ""
  staticTokensMaxFileBytes: 1048576
  staticTokensMaxEntries: 1024
  staticPrincipalMaxBytes: 512
  staticTokensReloadInterval: "5s"

logging:
  level: info
  format: json
  # Deprecated compatibility-only key: true is accepted but never enables raw
  # SQL, row, protobuf, HTTP body, error-text, or credential logging.
  # https://cloud.google.com/logging/docs/audit/best-practices
  unsafePayloads: false

admin:
  enabled: false
  address: 127.0.0.1:9051
  tokenFile: ""
  readHeaderTimeout: "5s"
  maxStackBytes: 4194304

ui:
  enabled: false
  directory: ""

contracts:
  profileDirectory: contract/profiles
