schemaVersion: "3"
runtimeProfiles:
  - id: python-3.13
    family: python
    kind: python-pytest
  - id: google-cloud-sdk-566.0.0
    family: bq
    kind: bq-cli
  - id: spark-3.5.8-pyspark
    family: spark
    kind: spark-pyspark
  - id: spark-3.5.8-scala
    family: spark
    kind: spark-scala
runnerAdapters:
  - id: python-pytest-v1
    family: python
    runtimeKind: python-pytest
    selectorPrefix: pytest
    requiredVersions: [python, client]
    requiredArtifactUsages: [python-wheel]
    setupOperationIds: [bqemu.health.ready, bqemu.projects.create, bqemu.projects.delete]
  - id: bq-cli-v1
    family: bq
    runtimeKind: bq-cli
    selectorPrefix: bq
    requiredVersions: [cloudSdk, bq]
    requiredArtifactUsages: [cloud-sdk-release-provenance]
    setupOperationIds: [bqemu.health.ready, bqemu.projects.create, bqemu.discovery.get]
  - id: spark-pyspark-pytest-v1
    family: spark
    runtimeKind: spark-pyspark
    selectorPrefix: pytest
    requiredVersions: [spark, connector, scala, scalaBinary, java, python]
    requiredArtifactUsages: [spark-connector-dsv1-jar, spark-python-bridge, spark-runtime]
    setupOperationIds: [bqemu.health.ready, bqemu.projects.create, bigquery.datasets.insert]
  - id: spark-scala-shell-v1
    family: spark
    runtimeKind: spark-scala
    selectorPrefix: pytest
    requiredVersions: [spark, connector, scala, scalaBinary, java, python]
    requiredArtifactUsages: [spark-connector-dsv1-jar, spark-python-bridge, spark-runtime]
    setupOperationIds: [bqemu.health.ready, bqemu.projects.create, bigquery.datasets.insert]
  - id: python-indirect-load-v1
    family: python
    runtimeKind: python-pytest
    selectorPrefix: load
    requiredVersions: [python, client]
    requiredArtifactUsages: [python-wheel]
    setupOperationIds: [bqemu.health.ready, bqemu.projects.create]
  - id: bq-indirect-load-v1
    family: bq
    runtimeKind: bq-cli
    selectorPrefix: load
    requiredVersions: [cloudSdk, bq]
    requiredArtifactUsages: [cloud-sdk-release-provenance]
    setupOperationIds: [bqemu.health.ready, bqemu.projects.create, bqemu.discovery.get]
  - id: spark-pyspark-indirect-load-v1
    family: spark
    runtimeKind: spark-pyspark
    selectorPrefix: load
    requiredVersions: [spark, connector, scala, scalaBinary, java, python, hadoopGcsConnector]
    requiredArtifactUsages: [spark-connector-dsv1-jar, spark-python-bridge, spark-runtime, hadoop-gcs-connector-jar]
    setupOperationIds: [bqemu.health.ready, bqemu.projects.create]
  - id: spark-scala-indirect-load-v1
    family: spark
    runtimeKind: spark-scala
    selectorPrefix: load
    requiredVersions: [spark, connector, scala, scalaBinary, java, python, hadoopGcsConnector]
    requiredArtifactUsages: [spark-connector-dsv1-jar, spark-python-bridge, spark-runtime, hadoop-gcs-connector-jar]
    setupOperationIds: [bqemu.health.ready, bqemu.projects.create]
compatibilityProfiles:
  - id: google-cloud-bigquery-python-public-v1
    scenarioIds: [python-metadata, python-query, python-tabledata]
  - id: bq-cli-public-v1
    scenarioIds: [bq-metadata, bq-query]
  - id: spark-bigquery-connector-public-v1
    scenarioIds: [spark-pyspark-public-edge, spark-scala-public-edge]
  - id: google-cloud-bigquery-python-indirect-load-v1
    scenarioIds: [python-indirect-load]
  - id: google-cloud-bigquery-python-media-upload-v1
    scenarioIds: [python-dataframe-media-upload]
  - id: bq-cli-indirect-load-v1
    scenarioIds: [bq-indirect-load]
  - id: spark-bigquery-connector-indirect-load-v1
    scenarioIds: [spark-pyspark-indirect-load, spark-scala-indirect-load]
scenarios:
  - id: python-metadata
    trafficSource: {kind: annotations}
    selectors: [pytest:tests/integration/python/test_admin_contract.py]
  - id: python-query
    trafficSource: {kind: annotations}
    selectors:
      - pytest:tests/integration/python/test_query_contract.py
      - pytest:tests/integration/python/test_query_lifecycle_contract.py
      - pytest:tests/integration/python/test_explicit_gaps.py
  - id: python-tabledata
    trafficSource: {kind: annotations}
    selectors: [pytest:tests/integration/python/test_tabledata_contract.py]
  - id: bq-metadata
    trafficSource: {kind: annotations}
    selectors: [bq:tests/integration/bqcli/run_contract.py:main]
  - id: bq-query
    trafficSource: {kind: annotations}
    selectors: [bq:tests/integration/bqcli/run_contract.py:main]
  - id: spark-pyspark-public-edge
    trafficSource: {kind: annotations}
    selectors:
      - pytest:tests/integration/spark/test_public_edge.py
    operationExpectations:
      - operationId: grpc.bigquery-read.read-rows
        min: 1
        max: 0
        after: [grpc.bigquery-read.create-read-session]
      - operationId: grpc.bigquery-write.append-rows
        min: 1
        max: 0
        after: [grpc.bigquery-write.create-write-stream]
      - operationId: grpc.bigquery-write.batch-commit-write-streams
        min: 1
        max: 0
        after: [grpc.bigquery-write.finalize-write-stream]
  - id: spark-scala-public-edge
    trafficSource: {kind: annotations}
    selectors:
      - pytest:tests/integration/spark/test_scala_public_edge.py
      - pytest:tests/integration/spark/test_scala_decimal_edge.py
    operationExpectations:
      - operationId: grpc.bigquery-read.read-rows
        min: 1
        max: 0
        after: [grpc.bigquery-read.create-read-session]
      - operationId: grpc.bigquery-write.append-rows
        min: 1
        max: 0
        after: [grpc.bigquery-write.create-write-stream]
      - operationId: grpc.bigquery-write.batch-commit-write-streams
        min: 1
        max: 0
        after: [grpc.bigquery-write.finalize-write-stream]
  - id: python-indirect-load
    trafficSource:
      kind: runner-evidence
      reason: The load runner generates traffic outside a selected Python test function.
    selectors: [load:python]
    operationExpectations:
      - operationId: bigquery.jobs.insert
        min: 1
        max: 0
        after: []
      - operationId: bigquery.jobs.get
        min: 1
        max: 0
        after: [bigquery.jobs.insert]
  - id: python-dataframe-media-upload
    trafficSource: {kind: annotations}
    selectors: [pytest:tests/integration/python/test_media_upload_contract.py]
    operationExpectations:
      - operationId: bigquery.tables.get
        min: 0
        max: 0
        after: []
      - operationId: bigquery.jobs.insert.upload
        min: 3
        max: 0
        after: []
      - operationId: bigquery.jobs.insert.upload-resume
        min: 1
        max: 0
        after: [bigquery.jobs.insert.upload]
      - operationId: bigquery.jobs.get
        min: 3
        max: 0
        after: [bigquery.jobs.insert.upload]
  - id: bq-indirect-load
    trafficSource:
      kind: runner-evidence
      reason: The load runner generates traffic inside the standalone bq process rather than a selected Python function.
    selectors: [load:bq]
    operationExpectations:
      - operationId: bigquery.jobs.insert
        min: 1
        max: 0
        after: []
      - operationId: bigquery.jobs.get
        min: 1
        max: 0
        after: [bigquery.jobs.insert]
  - id: spark-pyspark-indirect-load
    trafficSource:
      kind: runner-evidence
      reason: The load runner generates traffic inside the released PySpark process rather than a selected test function.
    selectors: [load:pyspark]
    operationExpectations:
      - operationId: bigquery.tables.get
        min: 1
        max: 0
        after: []
      - operationId: bigquery.tables.insert
        min: 1
        max: 1
        after: [bigquery.tables.get]
      - operationId: bigquery.jobs.insert
        min: 2
        max: 2
        after: [bigquery.tables.insert]
      - operationId: bigquery.jobs.get
        min: 2
        max: 0
        after: [bigquery.jobs.insert]
      - operationId: bigquery.jobs.getQueryResults
        min: 1
        max: 0
        after: [bigquery.jobs.insert]
      - operationId: bigquery.tables.delete
        min: 1
        max: 1
        after: [bigquery.jobs.get]
  - id: spark-scala-indirect-load
    trafficSource:
      kind: runner-evidence
      reason: The load runner generates traffic inside the released Scala Spark process rather than a selected test function.
    selectors: [load:scala-spark]
    operationExpectations:
      - operationId: bigquery.tables.get
        min: 1
        max: 0
        after: []
      - operationId: bigquery.tables.insert
        min: 1
        max: 1
        after: [bigquery.tables.get]
      - operationId: bigquery.jobs.insert
        min: 2
        max: 2
        after: [bigquery.tables.insert]
      - operationId: bigquery.jobs.get
        min: 2
        max: 0
        after: [bigquery.jobs.insert]
      - operationId: bigquery.jobs.getQueryResults
        min: 1
        max: 0
        after: [bigquery.jobs.insert]
      - operationId: bigquery.tables.delete
        min: 1
        max: 1
        after: [bigquery.jobs.get]
scenarioSets:
  - id: python-public-contract
    scenarioIds: [python-metadata, python-query, python-tabledata]
  - id: bq-public-contract
    scenarioIds: [bq-metadata, bq-query]
  - id: spark-pyspark-public-contract
    scenarioIds: [spark-pyspark-public-edge]
  - id: spark-scala-public-contract
    scenarioIds: [spark-scala-public-edge]
  - id: python-indirect-load-contract
    scenarioIds: [python-indirect-load]
  - id: python-media-upload-contract
    scenarioIds: [python-dataframe-media-upload]
  - id: bq-indirect-load-contract
    scenarioIds: [bq-indirect-load]
  - id: spark-pyspark-indirect-load-contract
    scenarioIds: [spark-pyspark-indirect-load]
  - id: spark-scala-indirect-load-contract
    scenarioIds: [spark-scala-indirect-load]
