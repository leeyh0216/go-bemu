name: spark-connector-contract

on:
  workflow_call:
  schedule:
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spark-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BQEMU_GO_TEST_TIMEOUT: 3m
  BQEMU_SPARK_TEST_TIMEOUT_SECONDS: "600"
  BQEMU_SPARK_RPC_TIMEOUT_SECONDS: "30"
  BQEMU_ARTIFACT_TIMEOUT_SECONDS: "180"

jobs:
  protocol-matrix:
    name: Connector 0.44.2 matrix guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Reject unclassified or drifting connector contracts
        run: go test -race -timeout "$BQEMU_GO_TEST_TIMEOUT" ./contract

  spark-public-edge:
    name: Real Spark public-edge slice
    needs: protocol-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.artifacts/spark/pycache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install locks and run TLS REST and gRPC public-edge contracts
        run: make spark-contract
      - name: Upload payload-safe Spark diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spark-public-edge-diagnostics-${{ github.run_id }}
          path: .artifacts/spark/diagnostics
          if-no-files-found: ignore
          retention-days: 7
