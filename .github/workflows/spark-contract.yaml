name: spark-connector-contract

on:
  workflow_call:
    inputs:
      lanes:
        description: Comma-separated normalized consumer lanes
        required: false
        type: string
        default: required
  schedule:
    - cron: "17 18 * * 0"
  workflow_dispatch:
    inputs:
      lanes:
        description: Comma-separated normalized consumer lanes
        required: false
        type: string
        default: preview,nightly

permissions:
  contents: read

concurrency:
  group: spark-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BQEMU_GO_TEST_TIMEOUT: 3m
  BQEMU_SPARK_TEST_TIMEOUT_SECONDS: "600"
  BQEMU_SPARK_RPC_TIMEOUT_SECONDS: "30"
  BQEMU_ARTIFACT_TIMEOUT_SECONDS: "180"

jobs:
  consumer-matrix:
    name: Normalize selected Spark cases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      spark: ${{ steps.matrix.outputs.spark }}
      has_spark: ${{ steps.matrix.outputs.has_spark }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Emit normalized Spark matrix
        id: matrix
        env:
          BQEMU_CONSUMER_LANES: ${{ inputs.lanes || 'preview,nightly' }}
        run: go run ./cmd/contractctl matrix --root . --family spark --lane "$BQEMU_CONSUMER_LANES" --output-key spark --presence-key has_spark >> "$GITHUB_OUTPUT"

  protocol-matrix:
    name: Connector protocol matrix guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Reject unclassified or drifting connector contracts
        run: go test -race -timeout "$BQEMU_GO_TEST_TIMEOUT" ./contract

  spark-public-edge:
    name: Spark / ${{ matrix.id }} / ${{ matrix.scenarioSet.id }}
    if: needs.consumer-matrix.outputs.has_spark == 'true'
    needs: [consumer-matrix, protocol-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.consumer-matrix.outputs.spark) }}
    env:
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.artifacts/spark/pycache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.runnerAdapter.bootstrap.python }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.runtimeProfile.versions.java }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install locked Spark test runtime
        run: make spark-prepare
      - name: Run typed TLS REST and gRPC public-edge contract
        env:
          BQEMU_CONSUMER_CASE: ${{ matrix.id }}
        run: .artifacts/spark/venv/bin/python scripts/consumer_runner.py --case "$BQEMU_CONSUMER_CASE"
      - name: Upload payload-safe Spark diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-${{ matrix.id }}-${{ github.run_id }}
          path: |
            .artifacts/consumers/${{ matrix.id }}/evidence.json
            .artifacts/consumers/${{ matrix.id }}/diff.json
            .artifacts/consumers/${{ matrix.id }}/junit.xml
            .artifacts/consumers/${{ matrix.id }}/runner.log
            .artifacts/consumers/${{ matrix.id }}/runner-error.txt
            .artifacts/spark/diagnostics/emulator-tail.log
            .artifacts/spark/diagnostics/jvm-tail.log
            .artifacts/spark/diagnostics/trace.jsonl
          if-no-files-found: ignore
          retention-days: 7
