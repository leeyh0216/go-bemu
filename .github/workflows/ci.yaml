name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BQEMU_GO_TEST_TIMEOUT: 10m
  BQEMU_PYTEST_TIMEOUT_SECONDS: "300"
  BQEMU_BQCLI_TIMEOUT_SECONDS: "300"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-contract:
    name: Go contract, race, and vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd contract docs internal)"
      - name: Test with race detector
        run: go test -race -timeout "$BQEMU_GO_TEST_TIMEOUT" ./...
      - name: Vet
        run: go vet ./...

  python-client:
    name: Official Python client contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install hash-locked dependencies
        run: uv pip sync --system --require-hashes tests/python/requirements.lock
      - name: Run real-process client contract
        run: |
          mkdir -p .artifacts/python
          python -m pytest -c tests/python/pytest.ini tests/python \
            --basetemp=.artifacts/python/pytest
      - name: Upload redacted failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-client-diagnostics-${{ github.run_id }}
          path: .artifacts/python
          if-no-files-found: ignore
          retention-days: 7

  bq-cli:
    name: Official bq CLI contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 566.0.0
          install_components: bq
      - name: Verify exact bq consumer version
        run: test "$(bq version)" = "This is BigQuery CLI 2.1.31"
      - name: Run real-process bq contract
        env:
          BQEMU_BQCLI_VERSION: 2.1.31
          BQEMU_BQCLI_ARTIFACT_DIR: .artifacts/bqcli
        run: |
          mkdir -p .artifacts/bqcli
          python3 tests/bqcli/run_contract.py
      - name: Upload payload-safe bq diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bq-cli-diagnostics-${{ github.run_id }}
          path: .artifacts/bqcli
          if-no-files-found: ignore
          retention-days: 7

  container-smoke:
    name: Non-root container and Compose smoke
    needs: go-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BQEMU_IMAGE: go-bemu:ci
      BQEMU_HTTP_PORT: "19050"
      BQEMU_GRPC_PORT: "19060"
      BQEMU_ADMIN_PORT: "19051"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned multi-stage image
        run: docker build --tag "$BQEMU_IMAGE" .
      - name: Start read-only Compose service
        run: timeout 180s docker compose up -d --no-build --wait --wait-timeout 120 bqemu
      - name: Verify readiness, identity, writable paths, and query
        run: |
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:19050/readyz
          test "$(docker compose exec -T bqemu id -u)" = "65532"
          docker compose exec -T bqemu sh -c \
            'test -w /data && test -w /tmp/bqemu && ! test -w /etc/bqemu/bqemu.yaml'
          curl --fail --silent --show-error --max-time 5 \
            -X POST http://127.0.0.1:19050/bigquery/v2/projects/local-project/queries \
            -H 'Content-Type: application/json' \
            -d '{"query":"SELECT 1 AS answer","useLegacySql":false}' \
            | grep -q '"answer"'
      - name: Capture payload-safe container logs
        if: failure()
        run: |
          mkdir -p .artifacts/docker
          docker compose ps --all >.artifacts/docker/compose-ps.txt || true
          docker compose logs --no-color >.artifacts/docker/compose.log 2>&1 || true
      - name: Upload container failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-diagnostics-${{ github.run_id }}
          path: .artifacts/docker
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop Compose service
        if: always()
        run: docker compose down --volumes --remove-orphans
