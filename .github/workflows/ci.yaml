name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  BQEMU_GO_TEST_TIMEOUT: 10m
  BQEMU_PYTEST_TIMEOUT_SECONDS: "300"
  BQEMU_BQCLI_TIMEOUT_SECONDS: "300"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Static validation and workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate static contracts
        run: make ci-static

  go-tests:
    name: Go / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core and application
            target: ci-test-core
          - name: Engine adapters
            target: ci-test-adapters
          - name: Storage Read
            target: ci-test-storage-read
          - name: Storage Write
            target: ci-test-storage-write
          - name: REST and gRPC transport
            target: ci-test-transport
          - name: Composition and contracts
            target: ci-test-composition
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run bounded race tests
        env:
          CI_TARGET: ${{ matrix.target }}
        run: make "$CI_TARGET"

  go-smoke:
    name: Go / Complete package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test every Go package
        run: make ci-test-all

  python-client:
    name: Official Python client contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install hash-locked dependencies
        run: uv pip sync --system --require-hashes tests/python/requirements.lock
      - name: Run real-process client contract
        run: |
          mkdir -p .artifacts/python
          python -m pytest -c tests/python/pytest.ini tests/python \
            --basetemp=.artifacts/python/pytest
      - name: Upload redacted failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-client-diagnostics-${{ github.run_id }}
          path: .artifacts/python
          if-no-files-found: ignore
          retention-days: 7

  bq-cli:
    name: Official bq CLI contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 566.0.0
          install_components: bq
      - name: Verify exact bq consumer version
        run: test "$(bq version)" = "This is BigQuery CLI 2.1.31"
      - name: Run real-process bq contract
        env:
          BQEMU_BQCLI_VERSION: 2.1.31
          BQEMU_BQCLI_ARTIFACT_DIR: .artifacts/bqcli
        run: |
          mkdir -p .artifacts/bqcli
          python3 tests/bqcli/run_contract.py
      - name: Upload payload-safe bq diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bq-cli-diagnostics-${{ github.run_id }}
          path: .artifacts/bqcli
          if-no-files-found: ignore
          retention-days: 7

  container-smoke:
    name: Non-root container and Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BQEMU_IMAGE: go-bemu:ci
      BQEMU_HTTP_PORT: "19050"
      BQEMU_GRPC_PORT: "19060"
      BQEMU_ADMIN_PORT: "19051"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned multi-stage image
        run: docker build --tag "$BQEMU_IMAGE" .
      - name: Start read-only Compose service
        run: timeout 180s docker compose up -d --no-build --wait --wait-timeout 120 bqemu
      - name: Verify readiness, identity, writable paths, and query
        run: |
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:19050/readyz
          test "$(docker compose exec -T bqemu id -u)" = "65532"
          docker compose exec -T bqemu sh -c \
            'test -w /data && test -w /tmp/bqemu && ! test -w /etc/bqemu/bqemu.yaml'
          curl --fail --silent --show-error --max-time 5 \
            -X POST http://127.0.0.1:19050/bigquery/v2/projects/local-project/queries \
            -H 'Content-Type: application/json' \
            -d '{"query":"SELECT 1 AS answer","useLegacySql":false}' \
            | grep -q '"answer"'
      - name: Capture payload-safe container logs
        if: failure()
        run: |
          mkdir -p .artifacts/docker
          docker compose ps --all >.artifacts/docker/compose-ps.txt || true
          docker compose logs --no-color >.artifacts/docker/compose.log 2>&1 || true
      - name: Upload container failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-diagnostics-${{ github.run_id }}
          path: .artifacts/docker
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop Compose service
        if: always()
        run: docker compose down --volumes --remove-orphans

  spark-contract:
    name: Spark BigQuery Connector contract
    permissions:
      contents: read
    uses: ./.github/workflows/spark-contract.yaml

  auth-client-test:
    name: Credential and TLS / ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: python
            python_version: "3.13"
            setup_target: python-setup
          - case: bq
            python_version: ""
            setup_target: ""
          - case: pyspark
            python_version: "3.11"
            setup_target: auth-spark-setup
          - case: scala-spark
            python_version: "3.11"
            setup_target: auth-spark-setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare case-specific diagnostics
        env:
          CONSUMER_CASE: ${{ matrix.case }}
        run: |
          mkdir -p ".artifacts/auth/$CONSUMER_CASE"
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"UTF-8\"?><testsuite name=\"bqemu-auth-$CONSUMER_CASE\" tests=\"1\" failures=\"1\"><testcase classname=\"bqemu.auth\" name=\"$CONSUMER_CASE\"><failure message=\"runner-not-reached\"/></testcase></testsuite>" \
            > ".artifacts/auth/$CONSUMER_CASE/junit-$CONSUMER_CASE.xml"
          chmod 0600 ".artifacts/auth/$CONSUMER_CASE/junit-$CONSUMER_CASE.xml"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ matrix.python_version != '' }}
        with:
          python-version: ${{ matrix.python_version }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: ${{ matrix.setup_target != '' }}
        with:
          enable-cache: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: ${{ matrix.case == 'bq' }}
        with:
          version: 566.0.0
          install_components: bq
      - name: Verify exact bq consumer version
        if: ${{ matrix.case == 'bq' }}
        run: test "$(bq version)" = "This is BigQuery CLI 2.1.31"
      - name: Install pinned case dependencies
        if: ${{ matrix.setup_target != '' }}
        env:
          SETUP_TARGET: ${{ matrix.setup_target }}
        run: make "$SETUP_TARGET"
      - name: Run real-process credential case
        env:
          CONSUMER_CASE: ${{ matrix.case }}
        run: |
          make auth-client-test \
            BQEMU_AUTH_CASE="$CONSUMER_CASE" \
            BQEMU_AUTH_JUNIT=".artifacts/auth/$CONSUMER_CASE/junit-$CONSUMER_CASE.xml" \
            BQEMU_AUTH_DIAGNOSTICS=".artifacts/auth/$CONSUMER_CASE/events.ndjson"
      - name: Upload case-specific diagnostics and JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auth-client-${{ matrix.case }}-diagnostics-${{ github.run_id }}
          path: .artifacts/auth/${{ matrix.case }}
          if-no-files-found: error
          retention-days: 7

  validation-complete:
    name: All required validation succeeded
    if: ${{ always() }}
    needs:
      - static-validation
      - go-smoke
      - go-tests
      - python-client
      - bq-cli
      - spark-contract
      - auth-client-test
      - container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject failed, cancelled, or skipped validation
        env:
          STATIC_RESULT: ${{ needs.static-validation.result }}
          GO_SMOKE_RESULT: ${{ needs.go-smoke.result }}
          GO_RESULT: ${{ needs.go-tests.result }}
          PYTHON_RESULT: ${{ needs.python-client.result }}
          BQ_RESULT: ${{ needs.bq-cli.result }}
          SPARK_RESULT: ${{ needs.spark-contract.result }}
          AUTH_CLIENT_RESULT: ${{ needs.auth-client-test.result }}
          CONTAINER_RESULT: ${{ needs.container-smoke.result }}
        run: |
          failed=0
          for result in \
            "static-validation:$STATIC_RESULT" \
            "go-smoke:$GO_SMOKE_RESULT" \
            "go-tests:$GO_RESULT" \
            "python-client:$PYTHON_RESULT" \
            "bq-cli:$BQ_RESULT" \
            "spark-contract:$SPARK_RESULT" \
            "auth-client-test:$AUTH_CLIENT_RESULT" \
            "container-smoke:$CONTAINER_RESULT"
          do
            job=${result%%:*}
            status=${result#*:}
            printf '%s\n' "required_job=$job result=$status"
            if test "$status" != success; then
              failed=1
            fi
          done
          exit "$failed"

  publish:
    name: Publish validated image
    needs: validation-complete
    if: >-
      ${{
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-ghcr.yaml
