name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  BQEMU_GO_TEST_TIMEOUT: 10m
  BQEMU_PYTEST_TIMEOUT_SECONDS: "300"
  BQEMU_BQCLI_TIMEOUT_SECONDS: "300"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Static validation and workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate static contracts
        run: make ci-static

  go-tests:
    name: Go / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core and application
            target: ci-test-core
          - name: Engine adapters
            target: ci-test-adapters
          - name: Storage Read
            target: ci-test-storage-read
          - name: Storage Write
            target: ci-test-storage-write
          - name: REST and gRPC transport
            target: ci-test-transport
          - name: Composition and contracts
            target: ci-test-composition
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run bounded race tests
        env:
          CI_TARGET: ${{ matrix.target }}
        run: make "$CI_TARGET"

  go-smoke:
    name: Go / Complete package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test every Go package
        run: make ci-test-all

  consumer-matrix:
    name: Normalize required consumer matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      python: ${{ steps.matrix.outputs.python }}
      bq: ${{ steps.matrix.outputs.bq }}
      auth: ${{ steps.matrix.outputs.auth }}
      load: ${{ steps.matrix.outputs.load }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Emit normalized required matrices
        id: matrix
        run: |
          go run ./tests/integration/cmd/integrationctl matrix --root . --family python --lane required --execution public --output-key python >> "$GITHUB_OUTPUT"
          go run ./tests/integration/cmd/integrationctl matrix --root . --family bq --lane required --execution public --output-key bq >> "$GITHUB_OUTPUT"
          go run ./tests/integration/cmd/integrationctl matrix --root . --lane required --execution public --output-key auth >> "$GITHUB_OUTPUT"
          go run ./tests/integration/cmd/integrationctl matrix --root . --lane required --execution indirect-load --output-key load >> "$GITHUB_OUTPUT"

  python-client:
    name: Python / ${{ matrix.id }} / ${{ matrix.scenarioSet.id }}
    needs: consumer-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.consumer-matrix.outputs.python) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.runtimeProfile.versions.python }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install hash-locked dependencies
        run: uv pip sync --system --require-hashes tests/python/requirements.lock
      - name: Run real-process client contract
        env:
          BQEMU_CONSUMER_CASE: ${{ matrix.id }}
        run: python -m tests.integration.framework.consumer_runner --case "$BQEMU_CONSUMER_CASE" --execution "${{ matrix.executionId }}"
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-${{ matrix.id }}-${{ github.run_id }}
          path: |
            .artifacts/consumers/${{ matrix.id }}/${{ matrix.executionId }}/evidence.json
            .artifacts/consumers/${{ matrix.id }}/${{ matrix.executionId }}/diff.json
            .artifacts/consumers/${{ matrix.id }}/${{ matrix.executionId }}/junit.xml
            .artifacts/consumers/${{ matrix.id }}/${{ matrix.executionId }}/runner.log
            .artifacts/consumers/${{ matrix.id }}/${{ matrix.executionId }}/runner-error.txt
          if-no-files-found: ignore
          retention-days: 7

  bq-cli:
    name: bq / ${{ matrix.id }} / ${{ matrix.scenarioSet.id }}
    needs: consumer-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.consumer-matrix.outputs.bq) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: ${{ matrix.runtimeProfile.versions.cloudSdk }}
          install_components: bq
      - name: Run real-process bq contract
        env:
          BQEMU_CONSUMER_CASE: ${{ matrix.id }}
        run: python3 -m tests.integration.framework.consumer_runner --case "$BQEMU_CONSUMER_CASE" --execution "${{ matrix.executionId }}"
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-${{ matrix.id }}-${{ github.run_id }}
          path: |
            .artifacts/consumers/${{ matrix.id }}/${{ matrix.executionId }}/evidence.json
            .artifacts/consumers/${{ matrix.id }}/${{ matrix.executionId }}/diff.json
            .artifacts/consumers/${{ matrix.id }}/${{ matrix.executionId }}/junit.xml
            .artifacts/consumers/${{ matrix.id }}/${{ matrix.executionId }}/runner.log
            .artifacts/consumers/${{ matrix.id }}/${{ matrix.executionId }}/runner-error.txt
          if-no-files-found: ignore
          retention-days: 7

  load-contract:
    name: Indirect load / ${{ matrix.id }} / ${{ matrix.executionId }}
    needs: consumer-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.consumer-matrix.outputs.load) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ matrix.family != 'bq' }}
        with:
          python-version: ${{ matrix.runtimeProfile.versions.python }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: ${{ matrix.family == 'spark' }}
        with:
          distribution: temurin
          java-version: ${{ matrix.runtimeProfile.versions.java }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: ${{ matrix.family != 'bq' }}
        with:
          enable-cache: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: ${{ matrix.family == 'bq' }}
        with:
          version: ${{ matrix.runtimeProfile.versions.cloudSdk }}
          install_components: bq
      - name: Install Python client dependencies
        if: ${{ matrix.family == 'python' }}
        run: uv pip sync --system --require-hashes tests/python/requirements.lock
      - name: Install Spark runtime dependencies
        if: ${{ matrix.family == 'spark' }}
        env:
          BQEMU_SPARK_PYTHON_VERSION: ${{ matrix.runtimeProfile.versions.python }}
        run: make spark-prepare
      - name: Run typed indirect Parquet load contract
        env:
          BQEMU_CONSUMER_CASE: ${{ matrix.id }}
          BQEMU_CONSUMER_EXECUTION: ${{ matrix.executionId }}
        run: |
          if test "${{ matrix.family }}" = spark; then
            python=.artifacts/spark/venv/bin/python
          else
            python=python3
          fi
          "$python" -m tests.integration.framework.consumer_runner --case "$BQEMU_CONSUMER_CASE" --execution "$BQEMU_CONSUMER_EXECUTION"
      - name: Upload load evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-${{ matrix.id }}-${{ github.run_id }}
          path: |
            .artifacts/consumers/${{ matrix.id }}/${{ matrix.executionId }}/evidence.json
            .artifacts/consumers/${{ matrix.id }}/${{ matrix.executionId }}/diff.json
            .artifacts/consumers/${{ matrix.id }}/${{ matrix.executionId }}/junit.xml
            .artifacts/consumers/${{ matrix.id }}/${{ matrix.executionId }}/runner.log
            .artifacts/consumers/${{ matrix.id }}/${{ matrix.executionId }}/runner-error.txt
            .artifacts/consumers/${{ matrix.id }}/${{ matrix.executionId }}/load/*/evidence.json
            .artifacts/consumers/${{ matrix.id }}/${{ matrix.executionId }}/load/*/*.safe.json
          if-no-files-found: ignore
          retention-days: 7

  container-smoke:
    name: Non-root container and Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BQEMU_IMAGE: go-bemu:ci
      BQEMU_HTTP_PORT: "19050"
      BQEMU_GRPC_PORT: "19060"
      BQEMU_ADMIN_PORT: "19051"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned multi-stage image
        run: docker build --tag "$BQEMU_IMAGE" .
      - name: Start read-only Compose service
        run: timeout 180s docker compose up -d --no-build --wait --wait-timeout 120 bqemu
      - name: Verify readiness, identity, writable paths, and query
        run: |
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:19050/readyz
          test "$(docker compose exec -T bqemu id -u)" = "65532"
          docker compose exec -T bqemu sh -c \
            'test -w /data && test -w /tmp/bqemu && ! test -w /etc/bqemu/bqemu.yaml'
          curl --fail --silent --show-error --max-time 5 \
            -X POST http://127.0.0.1:19050/bigquery/v2/projects/local-project/queries \
            -H 'Content-Type: application/json' \
            -d '{"query":"SELECT 1 AS answer","useLegacySql":false}' \
            | grep -q '"answer"'
      - name: Capture container logs
        if: failure()
        run: |
          mkdir -p .artifacts/docker
          docker compose ps --all >.artifacts/docker/compose-ps.txt || true
          docker compose logs --no-color >.artifacts/docker/compose.log 2>&1 || true
      - name: Upload container failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-diagnostics-${{ github.run_id }}
          path: .artifacts/docker
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop Compose service
        if: always()
        run: docker compose down --volumes --remove-orphans

  spark-contract:
    name: Spark BigQuery Connector contract
    permissions:
      contents: read
    uses: ./.github/workflows/spark-contract.yaml

  auth-client-test:
    name: Credential and TLS / ${{ matrix.id }} / ${{ matrix.runnerAdapter.id }}
    needs: consumer-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.consumer-matrix.outputs.auth) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare case-specific diagnostics
        env:
          CONSUMER_CASE: ${{ matrix.id }}
        run: |
          mkdir -p ".artifacts/auth/$CONSUMER_CASE"
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"UTF-8\"?><testsuite name=\"bqemu-auth-$CONSUMER_CASE\" tests=\"1\" failures=\"1\"><testcase classname=\"bqemu.auth\" name=\"$CONSUMER_CASE\"><failure message=\"runner-not-reached\"/></testcase></testsuite>" \
            > ".artifacts/auth/$CONSUMER_CASE/junit-$CONSUMER_CASE.xml"
          chmod 0600 ".artifacts/auth/$CONSUMER_CASE/junit-$CONSUMER_CASE.xml"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ matrix.runnerAdapter.runtimeKind != 'bq-cli' }}
        with:
          python-version: ${{ matrix.runtimeProfile.versions.python }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: ${{ matrix.family == 'spark' }}
        with:
          distribution: temurin
          java-version: ${{ matrix.runtimeProfile.versions.java }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: ${{ matrix.runnerAdapter.runtimeKind != 'bq-cli' }}
        with:
          enable-cache: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: ${{ matrix.runnerAdapter.runtimeKind == 'bq-cli' }}
        with:
          version: ${{ matrix.runtimeProfile.versions.cloudSdk }}
          install_components: bq
      - name: Install Python client dependencies
        if: ${{ matrix.runnerAdapter.runtimeKind == 'python-pytest' }}
        env:
          BQEMU_PYTHON_VERSION: ${{ matrix.runtimeProfile.versions.python }}
        run: make python-setup
      - name: Install Spark client dependencies
        if: ${{ matrix.family == 'spark' }}
        env:
          BQEMU_SPARK_PYTHON_VERSION: ${{ matrix.runtimeProfile.versions.python }}
        run: make auth-spark-setup
      - name: Run real-process credential case
        env:
          CONSUMER_CASE: ${{ matrix.id }}
        run: |
          make auth-client-test \
            BQEMU_AUTH_CASE="$CONSUMER_CASE" \
            BQEMU_AUTH_JUNIT=".artifacts/auth/$CONSUMER_CASE/junit-$CONSUMER_CASE.xml" \
            BQEMU_AUTH_DIAGNOSTICS=".artifacts/auth/$CONSUMER_CASE/events.ndjson"
      - name: Upload case-specific diagnostics and JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auth-client-${{ matrix.id }}-diagnostics-${{ github.run_id }}
          path: .artifacts/auth/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 7

  validation-complete:
    name: All required validation succeeded
    if: ${{ always() }}
    needs:
      - static-validation
      - consumer-matrix
      - go-smoke
      - go-tests
      - python-client
      - bq-cli
      - load-contract
      - spark-contract
      - auth-client-test
      - container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject failed, cancelled, or skipped validation
        env:
          STATIC_RESULT: ${{ needs.static-validation.result }}
          CONSUMER_MATRIX_RESULT: ${{ needs.consumer-matrix.result }}
          GO_SMOKE_RESULT: ${{ needs.go-smoke.result }}
          GO_RESULT: ${{ needs.go-tests.result }}
          PYTHON_RESULT: ${{ needs.python-client.result }}
          BQ_RESULT: ${{ needs.bq-cli.result }}
          LOAD_RESULT: ${{ needs.load-contract.result }}
          SPARK_RESULT: ${{ needs.spark-contract.result }}
          AUTH_CLIENT_RESULT: ${{ needs.auth-client-test.result }}
          CONTAINER_RESULT: ${{ needs.container-smoke.result }}
        run: |
          failed=0
          for result in \
            "static-validation:$STATIC_RESULT" \
            "consumer-matrix:$CONSUMER_MATRIX_RESULT" \
            "go-smoke:$GO_SMOKE_RESULT" \
            "go-tests:$GO_RESULT" \
            "python-client:$PYTHON_RESULT" \
            "bq-cli:$BQ_RESULT" \
            "load-contract:$LOAD_RESULT" \
            "spark-contract:$SPARK_RESULT" \
            "auth-client-test:$AUTH_CLIENT_RESULT" \
            "container-smoke:$CONTAINER_RESULT"
          do
            job=${result%%:*}
            status=${result#*:}
            printf '%s\n' "required_job=$job result=$status"
            if test "$status" != success; then
              failed=1
            fi
          done
          exit "$failed"

  publish:
    name: Publish validated image
    needs: validation-complete
    if: >-
      ${{
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-ghcr.yaml
