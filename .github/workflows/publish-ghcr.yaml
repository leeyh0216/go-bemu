name: publish-ghcr

on:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  BQEMU_IMAGE: ghcr.io/leeyh0216/go-bemu
  BQEMU_CONSOLE_IMAGE: ghcr.io/leeyh0216/bqemu-console

jobs:
  publish:
    name: Publish multi-architecture image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install arm64 emulation
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Configure Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.BQEMU_IMAGE }}
          flavor: latest=auto
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=go-bemu
            org.opencontainers.image.description=Standalone BigQuery emulator backed by DuckDB
            org.opencontainers.image.source=https://github.com/leeyh0216/go-bemu
            org.opencontainers.image.url=https://github.com/leeyh0216/go-bemu

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha,scope=go-bemu-ghcr
          cache-to: type=gha,mode=max,scope=go-bemu-ghcr
          provenance: mode=max
          sbom: true

      - name: Generate console image metadata
        id: console-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.BQEMU_CONSOLE_IMAGE }}
          flavor: latest=auto
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=bqemu-console
            org.opencontainers.image.description=BigQuery emulator console frontend
            org.opencontainers.image.source=https://github.com/leeyh0216/go-bemu
            org.opencontainers.image.url=https://github.com/leeyh0216/go-bemu

      - name: Build and publish console image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.console-metadata.outputs.tags }}
          labels: ${{ steps.console-metadata.outputs.labels }}
          annotations: ${{ steps.console-metadata.outputs.annotations }}
          cache-from: type=gha,scope=go-bemu-console-ghcr
          cache-to: type=gha,mode=max,scope=go-bemu-console-ghcr
          provenance: mode=max
          sbom: true
